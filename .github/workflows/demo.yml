name: Validate and record Disposable Screens

on:
  push:
    branches: [Test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Test branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Install Chromium for browser capture
        run: npx playwright install --with-deps chromium

      - name: Start development server and verify readiness
        run: |
          mkdir -p demo
          nohup npm run dev > /tmp/disposable-screens-server.log 2>&1 < /dev/null &
          echo "Server process: $!"
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null && curl --fail --silent http://127.0.0.1:8787/api/status >/dev/null; then
              echo "Frontend and API ready"
              curl --fail --silent http://127.0.0.1:8787/api/status
              exit 0
            fi
            sleep 2
          done
          echo "Service readiness failed. Server log:"
          cat /tmp/disposable-screens-server.log
          exit 1

      - name: Verify browser interactions and record demo
        run: npm run record:demo

      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            echo "Installing FFmpeg for browser-video conversion..."
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -hide_banner -version | sed -n '1p'
          ffprobe -hide_banner -version | sed -n '1p'

      - name: Convert recording into verified MP4
        run: |
          set -Eeuo pipefail
          echo "Recorded files:"
          ls -lah demo/
          test -s demo/disposable-screens-demo.webm || { echo "::error::Playwright WebM recording is missing or empty"; exit 1; }
          echo "WebM input details:"
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 demo/disposable-screens-demo.webm
          echo "Encoding H.264 MP4..."
          if ! ffmpeg -hide_banner -nostdin -y -i demo/disposable-screens-demo.webm -an -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -movflags +faststart demo/disposable-screens-demo.mp4 2>&1 | tee demo/ffmpeg.log; then
            echo "::warning::H.264 encoding failed; retrying with MPEG-4 video encoding."
            ffmpeg -hide_banner -nostdin -y -i demo/disposable-screens-demo.webm -an -c:v mpeg4 -q:v 4 -pix_fmt yuv420p -movflags +faststart demo/disposable-screens-demo.mp4 2>&1 | tee -a demo/ffmpeg.log
          fi
          test -s demo/disposable-screens-demo.mp4 || { echo "::error::MP4 conversion produced no output"; exit 1; }
          ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration,size -of default=noprint_wrappers=1 demo/disposable-screens-demo.mp4
          ls -lh demo/disposable-screens-demo.mp4
          echo "MP4 generated successfully."

      - name: Save diagnostic logs
        if: always()
        run: |
          mkdir -p demo
          if test -f /tmp/disposable-screens-server.log; then
            cp /tmp/disposable-screens-server.log demo/server.log
            echo "Last 100 server log lines:"
            tail -n 100 demo/server.log
          fi
          if test -f demo/browser-errors.log; then
            echo "Browser diagnostics:"
            cat demo/browser-errors.log
          fi

      - name: Upload video, screenshots, and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disposable-screens-linkedin-demo
          path: |
            demo/*.mp4
            demo/*.webm
            demo/*.png
            demo/*.json
            demo/*.log
            demo/*.txt
          retention-days: 30
          if-no-files-found: warn
